<!DOCTYPE html>
<html lang="ja">
<head>

  <title>自己成長レーダーチャート</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      padding: 24px;
    }

      font-size: 0.8rem;
      color: #7a7a9a;
      margin-bottom: 14px;
    }

      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 7px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-export { background: linear-gradient(135deg, #7ecfff, #b07eff); color: #0f0f1a; }
    .btn-import { background: #22223a; color: #c9b8ff; border: 1px solid #3a3a5a; }
    .save-badge {
      font-size: 0.73rem;
      color: #5abf72;
      background: #182418;
      border: 1px solid #2a4a2a;
      border-radius: 6px;
      padding: 5px 13px;
    }
    #importInput { display: none; }

    .level-guide {
      max-width: 1120px;
      margin: 0 auto 18px;
      background: #16162a;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0004;
      padding: 14px 16px;
    }
    .level-guide h2 {
      font-size: 0.84rem;
      letter-spacing: 0.06em;
      color: #d8cdfd;
      margin-bottom: 10px;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 8px 12px;
    }
    .guide-item {
      background: #1b1b32;
      border-radius: 10px;
      padding: 8px;
    }
    .guide-item summary {
      cursor: pointer;
      color: #e5e8f9;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 8px;
      list-style: none;
    }
    .guide-item summary::-webkit-details-marker {
      display: none;
    }
    .item-level-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .level-row {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 8px;
      align-items: start;
      font-size: 0.75rem;
      line-height: 1.45;
      padding: 6px 8px;
      border-radius: 8px;
      background: #1b1b32;
    }
    .level-label {
      color: #ffd96b;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .level-text {
      color: #bfc4da;
    }
    .level-action {
      color: #97e6b3;
      margin-top: 2px;
      font-size: 0.72rem;
    }

      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1120px;
      margin: 0 auto;
      align-items: stretch;
    }

      width: 100%;
      background: #16162a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 32px #0006;
      min-width: 0;
    }
    .chart-wrapper canvas { max-width: 100%; }

    .controls-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- Category blocks ---- */
    .category-block {
      background: #16162a;
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 4px 16px #0004;
    }
    .category-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .cat-study { color: #7ecfff; }
    .cat-hobby { color: #a8ff7e; }
    .cat-work  { color: #ffb07e; }

    .item-block {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1f1f38;
    }
    .item-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

    .item-name {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .slider-tag {
      font-size: 0.68rem;
      width: 24px;
      text-align: right;
      color: #7a7a9a;
      flex-shrink: 0;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].current { background: linear-gradient(90deg, #7ecfff, #b07eff); }
    input[type="range"].target  { background: linear-gradient(90deg, #ff7eb3, #ffd700); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 5px #000a;
    }
    .slider-val {
      font-size: 0.82rem;
      font-weight: 700;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ---- Level descriptions ---- */
    .item-desc {
      margin-top: 6px;
      font-size: 0.7rem;
      line-height: 1.6;
      padding-left: 2px;
    }
    .desc-now  { color: rgba(126,207,255,0.85); }
    .desc-goal { color: rgba(255,215,0,0.8); }
    .desc-action {
      color: rgba(151,230,179,0.88);
      margin-left: 12px;
    }

    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #aaa;
    }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-current { background: #7ecfff; }
    .dot-target  { background: #ffd700; }
    @media (max-width: 820px) {
      .level-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<h1>自己成長レーダーチャート</h1>
<p class="subtitle">スコア 1〜10　|　ブラウザ内DBに自動保存（履歴5件）</p>

  <button class="btn btn-import" onclick="document.getElementById('importInput').click()">⬆ JSONを読み込む</button>
  <button class="btn btn-import" onclick="restoreFromHistory()">↺ 履歴から復元</button>
  <button class="btn btn-import" onclick="configureSupabaseSync()">☁ Supabase同期設定</button>
  <button class="btn btn-import" onclick="configureGitHubSync()">☁ GitHub同期設定</button>
  <button class="btn btn-import" onclick="linkProjectJsonFile()">🔗 プロジェクトJSON連携</button>
  <input type="file" id="importInput" accept=".json" onchange="importJSON(this)" />
  <span class="save-badge" id="saveBadge">● 保存なし（初回起動）</span>
  <span class="save-badge" id="storeBadge">● 保存先: 初期化中</span>

</section>

  </div>

    </div>
    <div class="category-block">

    <div class="category-block">

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function base64ToUtf8(str) {
  return decodeURIComponent(escape(atob(str)));
}

function normalizeSupabaseUrl(url) {
  return (url || '').trim().replace(/\/+$/, '');
}

function normalizeSupabaseConfig(raw) {
  if (!raw) return null;
  const supa = raw.supabase || raw;
  const url = normalizeSupabaseUrl(supa.url || supa.projectUrl || '');
  const anonKey = supa.anonKey || supa.publishableKey || '';
  const table = supa.table || 'app_state';
  const stateKey = supa.stateKey || 'self_goal_main';
  const writeToken = supa.writeToken || '';
  if (!url || !anonKey) return null;
  return { url, anonKey, table, stateKey, writeToken };
}

async function loadSupabaseConfigFromSettingFile() {
  try {
    const res = await fetch(SETTINGS_JSON_PATH, { cache: 'no-store' });
    if (!res.ok) return null;
    const cfg = normalizeSupabaseConfig(await res.json());
    return cfg;
  } catch (e) {
    return null;
  }
}

function loadSupabaseSyncConfig() {
  try {
    const raw = localStorage.getItem(SUPABASE_SYNC_CONFIG_KEY);
    if (!raw) return null;
    return normalizeSupabaseConfig(JSON.parse(raw));
  } catch (e) {
    return null;
  }
}

function saveSupabaseSyncConfig(cfg) {
  localStorage.setItem(SUPABASE_SYNC_CONFIG_KEY, JSON.stringify(cfg));
}

function clearSupabaseSyncConfig() {
  localStorage.removeItem(SUPABASE_SYNC_CONFIG_KEY);
  supabaseSyncConfig = null;
  setServerBadge('● Supabase同期: 未設定');
}

function supabaseTableUrl(cfg) {
  return `${cfg.url}/rest/v1/${encodeURIComponent(cfg.table)}`;
}

function buildSupabaseHeaders(cfg, includeJson) {
  const headers = {
    apikey: cfg.anonKey,
    Authorization: `Bearer ${cfg.anonKey}`,
  };
  if (cfg.writeToken) {
    headers['x-app-write-token'] = cfg.writeToken;
  }
  if (includeJson) {
    headers['Content-Type'] = 'application/json';
  }
  return headers;
}

async function fetchSupabaseState() {
  if (!supabaseSyncConfig) return null;
  const cfg = supabaseSyncConfig;
  const key = encodeURIComponent(cfg.stateKey);
  const url = `${supabaseTableUrl(cfg)}?state_key=eq.${key}&select=payload,updated_at&limit=1`;
  try {
    const res = await fetch(url, {
      headers: buildSupabaseHeaders(cfg, false),
      cache: 'no-store',
    });
    if (!res.ok) {
      setServerBadge(`● Supabase同期: 読込失敗 (${res.status})`);
      return null;
    }
    const rows = await res.json();
    const payload = Array.isArray(rows) && rows[0] ? rows[0].payload : null;
    if (payload?.items) {
      setServerBadge('● Supabase同期: 有効');
      return payload;
    }
    setServerBadge('● Supabase同期: 有効（初回保存待ち）');
    return null;
  } catch (e) {
    setServerBadge('● Supabase同期: 読込失敗');
    return null;
  }
}

async function pushSupabaseState(data) {
  if (!supabaseSyncConfig) return false;
  const cfg = supabaseSyncConfig;
  const url = `${supabaseTableUrl(cfg)}?on_conflict=state_key`;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        ...buildSupabaseHeaders(cfg, true),
        Prefer: 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify([
        {
          state_key: cfg.stateKey,
          payload: data,
          updated_at: new Date().toISOString(),
        },
      ]),
    });
    if (!res.ok) {
      setServerBadge(`● Supabase同期: 保存失敗 (${res.status})`);
      return false;
    }
    setServerBadge('● Supabase同期: 保存成功');
    return true;
  } catch (e) {
    setServerBadge('● Supabase同期: 保存失敗');
    return false;
  }
}

function scheduleSupabaseSync(data) {
  if (!supabaseSyncConfig) return;
  supabasePendingData = data;
  if (supabaseSyncTimer) clearTimeout(supabaseSyncTimer);
  supabaseSyncTimer = setTimeout(async () => {
    if (supabaseSyncInFlight || !supabasePendingData) return;
    supabaseSyncInFlight = true;
    const payload = supabasePendingData;
    supabasePendingData = null;
    try {
      await pushSupabaseState(payload);
    } finally {
      supabaseSyncInFlight = false;
      if (supabasePendingData) {
        scheduleSupabaseSync(supabasePendingData);
      }
    }
  }, 2000);
}

    return cfg;
  } catch (e) {

  }
}

function saveGitHubSyncConfig(cfg) {
  localStorage.setItem(GITHUB_SYNC_CONFIG_KEY, JSON.stringify(cfg));
}

function clearGitHubSyncConfig() {
  localStorage.removeItem(GITHUB_SYNC_CONFIG_KEY);
  githubSyncConfig = null;
  githubFileSha = '';
  setServerBadge('● GitHub同期: 未設定');
}

function githubApiUrl(cfg) {
  const pathEncoded = cfg.path.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${pathEncoded}?ref=${encodeURIComponent(cfg.branch)}`;
}

async function fetchGitHubRepoState() {
  if (!githubSyncConfig) return null;
  try {
    const res = await fetch(githubApiUrl(githubSyncConfig), {
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${githubSyncConfig.token}`,
      },
      cache: 'no-store',
    });
    if (!res.ok) {
      setServerBadge(`● GitHub同期: 読込失敗 (${res.status})`);
      return null;
    }
    const payload = await res.json();
    githubFileSha = payload.sha || '';
    const content = base64ToUtf8((payload.content || '').replace(/\n/g, ''));
    const parsed = JSON.parse(content);
    setServerBadge('● GitHub同期: 有効');
    return parsed;
  } catch (e) {
    setServerBadge('● GitHub同期: 読込失敗');
    return null;
  }
}

async function pushGitHubRepoState(data, retry = 1) {
  if (!githubSyncConfig) return false;
  const body = {
    message: `Update scores.json ${new Date().toISOString()}`,
    content: utf8ToBase64(JSON.stringify(data, null, 2) + '\n'),
    branch: githubSyncConfig.branch,
  };
  if (githubFileSha) body.sha = githubFileSha;

  const res = await fetch(`https://api.github.com/repos/${githubSyncConfig.owner}/${githubSyncConfig.repo}/contents/${githubSyncConfig.path}`, {
    method: 'PUT',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${githubSyncConfig.token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (res.status === 409) {
    if (retry <= 0) {
      setServerBadge('● GitHub同期: 競合エラー');
      return false;
    }
    await fetchGitHubRepoState();
    return pushGitHubRepoState(data, retry - 1);
  }
  if (!res.ok) {
    setServerBadge(`● GitHub同期: 保存失敗 (${res.status})`);
    return false;
  }
  const payload = await res.json();
  githubFileSha = payload?.content?.sha || githubFileSha;
  setServerBadge('● GitHub同期: 保存成功');
  return true;
}

function scheduleGitHubSync(data) {
  if (!githubSyncConfig) return;
  githubPendingData = data;
  if (githubSyncTimer) clearTimeout(githubSyncTimer);
  githubSyncTimer = setTimeout(async () => {
    if (githubSyncInFlight || !githubPendingData) return;
    githubSyncInFlight = true;
    const payload = githubPendingData;
    githubPendingData = null;
    try {
      await pushGitHubRepoState(payload);
    } finally {
      githubSyncInFlight = false;
      if (githubPendingData) {
        scheduleGitHubSync(githubPendingData);
      }
    }
  }, 2000);
}

  githubSyncConfig = { owner, repo, path, branch, token };
  saveGitHubSyncConfig(githubSyncConfig);
  githubFileSha = '';
  const remote = await fetchGitHubRepoState();
  if (remote?.items) {
    applyData(remote);
    setInputsFromData(remote);
    update();
  }
}

async function fetchServerState() {
  try {
    const res = await fetch(API_STATE_ENDPOINT, { cache: 'no-store' });
    if (!res.ok) return null;
    serverSyncEnabled = true;
    return await res.json();
  } catch (e) {
    serverSyncEnabled = false;
    return null;
  }
}

async function fetchStaticScores() {
  try {
    const res = await fetch('scores.json', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function saveToServerJson(data) {
  if (IS_GITHUB_PAGES) {
    setServerBadge('● GitHub Pages: 同期APIなし（ブラウザ保存のみ）');
    return false;
  }
  if (!serverSyncEnabled) {
    return false;
  }
  try {
    const res = await fetch(API_STATE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error('save failed');
    setServerBadge('● GitHub JSON同期: 成功');
    return true;
  } catch (e) {
    setServerBadge('● GitHub JSON同期: 失敗');
    return false;
  }
}

function openAppDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB not supported'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbPut(id, value) {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put({ id, value });
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbGet(id) {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(id);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
    tx.oncomplete = () => db.close();
  });
}

function setInputsFromData(data) {
  if (!data?.items) return;
  data.items.forEach(s => {
    const nowEl = document.getElementById(`now-${s.id}`);
    const goalEl = document.getElementById(`goal-${s.id}`);
    if (nowEl) nowEl.value = s.now;
    if (goalEl) goalEl.value = s.goal;
  });
}

function applyData(data) {
  if (data?.levelGuideByItem) {
    Object.entries(data.levelGuideByItem).forEach(([id, levels]) => {
      if (Array.isArray(levels) && levels.length === 10) {
        LEVEL_DESCRIPTIONS[id] = levels;
      }
    });
    renderLevelGuide();
  }
  if (data?.levelActionsByItem) {
    Object.entries(data.levelActionsByItem).forEach(([id, levels]) => {
      if (Array.isArray(levels) && levels.length === 10) {
        LEVEL_ACTIONS[id] = levels;
      }
    });
    renderLevelGuide();
  }
  if (!data?.items) return;
  data.items.forEach(s => {
    const item = items.find(i => i.id === s.id);
    if (item) { item.now = s.now; item.goal = s.goal; }
  });
  currentVersion = data?.appMeta?.version || currentVersion;
}

async function autoSave(options = {}) {
  const forceHistory = options.forceHistory === true;
  const data = {
    lastUpdated: new Date().toISOString(),
    appMeta: {
      version: currentVersion + 1,
      storage: 'indexeddb',
    },
    levelGuideByItem: LEVEL_DESCRIPTIONS,
    levelActionsByItem: LEVEL_ACTIONS,
    items: items.map(i => ({
      id: i.id,
      label: i.label,
      now:  parseInt(document.getElementById(`now-${i.id}`).value),
      goal: parseInt(document.getElementById(`goal-${i.id}`).value),
    })),
  };
  const serialized = JSON.stringify(data);
  localStorage.setItem(STORAGE_KEY, serialized);
  try {
    await idbPut(DB_KEY_LATEST, data);
    let history = await idbGet(DB_KEY_HISTORY);
    if (!Array.isArray(history)) history = [];
    const now = Date.now();
    const shouldAddHistory = forceHistory || (serialized !== lastSerialized && (now - lastHistoryAt > 30000));
    if (shouldAddHistory) {
      history.unshift({ savedAt: data.lastUpdated, version: data.appMeta.version, data });
      history = history.slice(0, 5);
      await idbPut(DB_KEY_HISTORY, history);
      lastHistoryAt = now;
    }
    setStoreBadge('● 保存先: IndexedDB');
  } catch (e) {
    setStoreBadge('● 保存先: localStorage(フォールバック)');
  }
  lastSerialized = serialized;
  currentVersion = data.appMeta.version;
  const t = new Date(data.lastUpdated);
  const ts = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} `
           + `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  document.getElementById('saveBadge').textContent = `● 自動保存: ${ts}`;
  if (projectFileHandle) {
    await syncToProjectJson(data);
  }
  scheduleSupabaseSync(data);
  await saveToServerJson(data);
  scheduleGitHubSync(data);
  return data;
}

async function loadFromBrowserStorage() {
  const fileSupabaseConfig = await loadSupabaseConfigFromSettingFile();
  if (fileSupabaseConfig) {
    supabaseSyncConfig = fileSupabaseConfig;
    saveSupabaseSyncConfig(fileSupabaseConfig);
  } else {
    supabaseSyncConfig = loadSupabaseSyncConfig();
  }
  if (supabaseSyncConfig) {
    setServerBadge('● Supabase同期: 接続確認中');
  }

  githubSyncConfig = loadGitHubSyncConfig();
  if (!supabaseSyncConfig && githubSyncConfig) {
    setServerBadge('● GitHub同期: 接続確認中');
  }

  const serverData = await fetchServerState();
  if (serverData?.items) {
    applyData(serverData);
    setInputsFromData(serverData);
    setStoreBadge('● 保存先: IndexedDB + GitHub JSON');
    setServerBadge('● GitHub JSON同期: 有効');
    update();
    return;
  }

  let supabaseData = null;
  if (supabaseSyncConfig) {
    supabaseData = await fetchSupabaseState();
  }

  let githubData = null;
  if (githubSyncConfig) {
    githubData = await fetchGitHubRepoState();
  }

  const toTime = data => {
    const ms = Date.parse(data?.lastUpdated || '');
    return Number.isNaN(ms) ? 0 : ms;
  };

  let staticData = null;
  if (IS_GITHUB_PAGES) {
    staticData = await fetchStaticScores();
    setServerBadge('● GitHub Pages: 同期APIなし（ブラウザ保存のみ）');
  }

  let idbData = null;
  try {
    idbData = await idbGet(DB_KEY_LATEST);
  } catch (e) {
    setStoreBadge('● 保存先: localStorage(フォールバック)');
  }

  let localData = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      localData = JSON.parse(raw);
    }
  } catch (e) {
    localData = null;
  }

  const candidates = [supabaseData, githubData, staticData, idbData, localData].filter(d => d?.items);
  if (candidates.length > 0) {
    candidates.sort((a, b) => toTime(b) - toTime(a));
    const selected = candidates[0];
    applyData(selected);
    setInputsFromData(selected);
    if (selected === supabaseData) {
      setStoreBadge('● 保存先: Supabase（全端末同期）');
    } else if (selected === githubData) {
      setStoreBadge('● 保存先: GitHub JSON（全端末同期）');
    } else if (selected === idbData) {
      setStoreBadge('● 保存先: IndexedDB（前回編集を復元）');
    } else if (selected === localData) {
      setStoreBadge('● 保存先: localStorage（前回編集を復元）');
    } else {
      setStoreBadge('● 保存先: scores.json（GitHub）');
    }
    update();
    return;
  }

  setStoreBadge('● 保存先: IndexedDB');
}

async function restoreFromHistory() {
  let history = [];
  try {
    history = await idbGet(DB_KEY_HISTORY);
  } catch (e) {
    alert('履歴の取得に失敗しました。');
    return;
  }
  if (!Array.isArray(history) || history.length === 0) {
    alert('復元できる履歴がありません。');
    return;
  }
  const list = history.map((h, i) => {
    const t = new Date(h.savedAt);
    const ts = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    return `${i + 1}. v${h.version || '-'} / ${ts}`;
  }).join('\n');
  const picked = prompt(`復元する履歴番号を入力してください:\n${list}`, '1');
  if (!picked) return;
  const idx = Number(picked) - 1;
  if (!Number.isInteger(idx) || idx < 0 || idx >= history.length) {
    alert('番号が不正です。');
    return;
  }
  const selected = history[idx].data;
  applyData(selected);
  setInputsFromData(selected);
  update();
  await autoSave({ forceHistory: true });
}

async function syncToProjectJson(data) {
  if (!projectFileHandle) return;
  try {
    const writable = await projectFileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    setServerBadge('● プロジェクトJSON同期中');
  } catch (e) {
    setServerBadge('● 同期エラー（再連携してください）');
  }
}

async function linkProjectJsonFile() {
  if (!window.showOpenFilePicker) {
    alert('このブラウザはプロジェクトJSON直接連携に非対応です。JSON保存ボタンをご利用ください。');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{
        description: 'JSON Files',
        accept: { 'application/json': ['.json'] }
      }],
      excludeAcceptAllOption: true,
      multiple: false,
    });
    projectFileHandle = handle;
    setServerBadge(`● 連携中: ${handle.name}`);
    const data = await autoSave({ forceHistory: true });
    await syncToProjectJson(data);
  } catch (e) {
    // user canceled
  }
}

// ── Export JSON ───────────────────────────────────────────────────────────────
async function exportJSON() {
  const data = await autoSave({ forceHistory: true });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scores.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Import JSON ───────────────────────────────────────────────────────────────
function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data?.items) { alert('有効なJSONファイルではありません'); return; }
      applyData(data);
      setInputsFromData(data);
      update();
      await autoSave({ forceHistory: true });
    } catch(err) {
      alert('JSONの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
  input.value = ''; // allow re-importing the same file
}
